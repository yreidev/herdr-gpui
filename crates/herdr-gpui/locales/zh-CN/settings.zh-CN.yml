"New VMs keep their OS disk on the VM's local storage, so there is no disk to pay for, and auto-stop deletes an idle one: keep work in Git. They run as Spot where Azure offers it to the subscription, and Azure may delete a Spot VM when it needs the capacity back; otherwise they are billed at the regular price. Linux list prices in %{location}, in US dollars, as of now: Spot prices move.": "新虚拟机的系统盘放在虚拟机的本地存储上，不另收磁盘费用；自动停止会删除空闲的虚拟机，所以工作请存进 Git。订阅能用 Spot 的地区按 Spot 运行，Azure 需要收回容量时可能删除 Spot 虚拟机；其他地区按常规价格计费。以下为 %{location} 当前的 Linux 标价（美元），Spot 价格会变动。"
