"Create Boat sandboxes and use them as devices. Herdr authorizes a GUI-owned SSH key and pins each machine's host key from Boat's authenticated API.": "创建 Boat 沙盒并用作设备。Herdr 会授权一把本应用专用的 SSH 密钥，并通过 Boat 经过认证的 API 固定每台机器的主机密钥。"
"Forget key": "忘记密钥"
"Use never to disable auto-stop: billing continues until you stop the sandbox in Boat. A number sets a fixed deadline, even during SSH work (trials require 1–7200 seconds). Applies on create and resume. For a running device, save then use Finish setup to extend from now or disable auto-stop.": "填 never 关闭自动停止：在 Boat 里停止沙盒前会一直计费。填数字则设定固定截止时间，SSH 工作期间也照样生效（试用账户须为 1–7200 秒）。创建和恢复时生效。设备正在运行时，先保存，再用“完成设置”从现在起延长期限或关闭自动停止。"
"Creates a sandbox with a generated name. Its device is saved before setup so an interruption can be retried without creating another sandbox.": "用自动生成的名称创建沙盒。设备会在设置前先保存，中途中断可以重试，不会再建一个沙盒。"
"Install Herdr in it when missing": "缺少时在其中安装 Herdr"
"Pending creation: %{name}. Recover creation reuses the original request and options, even after restarting. Recovery expires after 23 hours; it never silently creates a replacement.": "待完成的创建：%{name}。“恢复创建”会沿用原来的请求和选项，重启后也可以。恢复在 23 小时后失效，绝不会悄悄另建一个替代品。"
"Check the Boat dashboard first: the original sandbox may exist and still be billed. Forgetting only removes this local request. Creating again can create a second sandbox.": "请先查看 Boat 控制台：原来的沙盒可能已经存在并在计费。忘记只会删除本地的这条请求，再次创建可能会建出第二个沙盒。"
"Finish setup reuses the sandbox and applies Auto-stop after from now, extending a timed deadline or disabling it. The installation switch above also applies here; the setup script does not run again.": "“完成设置”会沿用这个沙盒，并从现在起应用“自动停止时间”，延长定时截止或将其关闭。上面的安装开关同样适用；初始化脚本不会再次运行。"
